<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="loyiha.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="continer">
        <div class="search">
            <form action="" class="myform">
                <input type="text" placeholder="Search" name="search">
            </form>
        </div>
        <div class="citysearch">    
            <img src="img/search-city.png" alt="" >
        </div>
        <div class="notfound none">
            <img src="img/not-found.png" alt="" >
            <span>404 Error Search somtime</span>
        </div>
        <div class="weather-info none">

            <div class="day">
                <h3   h3 class="cityname"><i class="fa-solid fa-location-dot"></i>City Name</h3>
                <h3 class="datee">Sun,8 May</h3>
            </div>
            <div class="cloud">
                <img src="img/thunderstorm.svg" alt="" class="imgshow">
                <div class="a">
                    <h3 class="selsi">29 °C</h3>
                    <p class="decor">Cloudy</p>
                </div>
            </div>
            <div class="weather">
                <div class="aa">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <h5 class="droplet">Humidity: <br> ?%</h5>
                    </div>
                </div>
                <div class="aa">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <h5 class="wind">Wind Speed: <br>? km/h</h5>
                    </div>
                </div>
            </div>
            <div class="block">
                <div class="block_list">
                    <h4 class="newday1">08 May</h4>
                    <img src="img/rain.svg" alt="" class="img1">
                    <h5 class="selsi1">30 °C</h5>
                </div>
                <div class="block_list">
                    <h4 class="newday2">08 May</h4>
                    <img src="img/rain.svg" alt="" class="img2">
                    <h5 class="selsi2">30 °C</h5>
                </div>
                <div class="block_list">
                    <h4 class="newday3">08 May</h4>
                    <img src="img/rain.svg" alt="" class="img3">
                    <h5 class="selsi3">30 °C</h5>
                </div>
            </div>
        </div>
    </div>
    <script src="loyiha.js"></script>
</body>

</html>
